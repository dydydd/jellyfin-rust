[package]
name = "jellyfin-model"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
indexmap = "2"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
serde_json = "1"
