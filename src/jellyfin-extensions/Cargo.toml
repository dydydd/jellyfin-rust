[package]
name = "jellyfin-extensions"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Cross-platform utility extensions for Jellyfin Rust"

[lib]
path = "src/lib.rs"

[dependencies]
rand = "0.9"
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
unicode-normalization = "0.1.24"
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints.rust]
unsafe_code = "forbid"
