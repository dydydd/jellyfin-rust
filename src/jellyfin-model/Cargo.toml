[package]
name = "jellyfin-model"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[features]
openapi = ["dep:schemars"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
indexmap = "2"
mime = "0.3"
mime_guess = "2"
schemars = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
