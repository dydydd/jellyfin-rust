[package]
name = "jellyfin-providers"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
description = "Metadata provider integrations for Jellyfin"

[lib]
path = "src/lib.rs"

[dependencies]
jellyfin-model = { path = "../jellyfin-model" }
jellyfin-naming = { path = "../jellyfin-naming" }
chrono.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"
